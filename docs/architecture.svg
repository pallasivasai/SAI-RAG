<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 16px Arial,sans-serif;fill:#cbd5e1}
      .section{font:700 20px Arial,sans-serif;fill:#f8fafc}
      .boxTitle{font:700 17px Arial,sans-serif;fill:#fff}
      .boxText{font:400 13px Arial,sans-serif;fill:#dbeafe}
      .small{font:400 12px Arial,sans-serif;fill:#cbd5e1}
      .arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;fill:none}
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="title">SAI-RAG — Actual Project Architecture</text>
  <text x="70" y="94" class="subtitle">Code-aligned RAG pipeline: knowledge-base construction → FAQ matching → FAISS retrieval → grounded Gemini response</text>

  <rect x="60" y="125" width="1280" height="245" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="85" y="160" class="section">1. Knowledge Base Construction</text>

  <rect x="85" y="190" width="175" height="105" rx="16" fill="url(#data)" filter="url(#shadow)"/>
  <text x="172" y="225" text-anchor="middle" class="boxTitle">sai_faqs.csv</text>
  <text x="172" y="248" text-anchor="middle" class="boxText">Local FAQ knowledge</text>
  <text x="172" y="268" text-anchor="middle" class="boxText">prompt + response</text>

  <path d="M260 242 L320 242" class="arrow"/>
  <rect x="320" y="190" width="175" height="105" rx="16" fill="#155e75" filter="url(#shadow)"/>
  <text x="407" y="225" text-anchor="middle" class="boxTitle">CSVLoader</text>
  <text x="407" y="248" text-anchor="middle" class="boxText">LangChain Documents</text>
  <text x="407" y="268" text-anchor="middle" class="boxText">document objects</text>

  <path d="M495 242 L555 242" class="arrow"/>
  <rect x="555" y="190" width="190" height="105" rx="16" fill="#0f766e" filter="url(#shadow)"/>
  <text x="650" y="225" text-anchor="middle" class="boxTitle">HuggingFace</text>
  <text x="650" y="248" text-anchor="middle" class="boxText">all-MiniLM-L6-v2</text>
  <text x="650" y="268" text-anchor="middle" class="boxText">text → embeddings</text>

  <path d="M745 242 L805 242" class="arrow"/>
  <rect x="805" y="190" width="175" height="105" rx="16" fill="#0369a1" filter="url(#shadow)"/>
  <text x="892" y="225" text-anchor="middle" class="boxTitle">FAISS</text>
  <text x="892" y="248" text-anchor="middle" class="boxText">Vector index</text>
  <text x="892" y="268" text-anchor="middle" class="boxText">vectorstore/</text>

  <path d="M980 242 L1040 242" class="arrow"/>
  <rect x="1040" y="190" width="250" height="105" rx="16" fill="#334155" filter="url(#shadow)"/>
  <text x="1165" y="225" text-anchor="middle" class="boxTitle">Runtime Refresh</text>
  <text x="1165" y="248" text-anchor="middle" class="boxText">CSV newer than index?</text>
  <text x="1165" y="268" text-anchor="middle" class="boxText">Rebuild FAISS automatically</text>

  <rect x="60" y="400" width="1280" height="430" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="85" y="435" class="section">2. Query + Retrieval-Augmented Generation</text>

  <rect x="85" y="475" width="180" height="105" rx="16" fill="#1d4ed8" filter="url(#shadow)"/>
  <text x="175" y="510" text-anchor="middle" class="boxTitle">Streamlit UI</text>
  <text x="175" y="533" text-anchor="middle" class="boxText">app.py</text>
  <text x="175" y="553" text-anchor="middle" class="boxText">Question + optional profile</text>

  <path d="M265 527 L330 527" class="arrow"/>
  <rect x="330" y="475" width="205" height="105" rx="16" fill="#4338ca" filter="url(#shadow)"/>
  <text x="432" y="510" text-anchor="middle" class="boxTitle">Answer Engine</text>
  <text x="432" y="533" text-anchor="middle" class="boxText">rag_pipeline.py</text>
  <text x="432" y="553" text-anchor="middle" class="boxText">answer_question()</text>

  <path d="M432 580 L432 625" class="arrow"/>
  <polygon points="432,625 350,690 514,690" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="432" y="654" text-anchor="middle" class="boxTitle">Strong FAQ match?</text>
  <text x="432" y="674" text-anchor="middle" class="small">exact / similarity ≥ 0.78</text>

  <path d="M350 690 L350 735 L265 735" class="arrow"/>
  <rect x="85" y="700" width="180" height="80" rx="16" fill="#166534" filter="url(#shadow)"/>
  <text x="175" y="730" text-anchor="middle" class="boxTitle">Direct FAQ Answer</text>
  <text x="175" y="752" text-anchor="middle" class="boxText">No Gemini call</text>

  <path d="M514 690 L650 690" class="arrow"/>
  <rect x="650" y="640" width="190" height="105" rx="16" fill="#075985" filter="url(#shadow)"/>
  <text x="745" y="675" text-anchor="middle" class="boxTitle">FAISS Retrieval</text>
  <text x="745" y="698" text-anchor="middle" class="boxText">profile-aware query</text>
  <text x="745" y="718" text-anchor="middle" class="boxText">similarity_search(k=4)</text>

  <path d="M840 692 L900 692" class="arrow"/>
  <rect x="900" y="640" width="180" height="105" rx="16" fill="#5b21b6" filter="url(#shadow)"/>
  <text x="990" y="675" text-anchor="middle" class="boxTitle">Retrieved Context</text>
  <text x="990" y="698" text-anchor="middle" class="boxText">Top 4 documents</text>
  <text x="990" y="718" text-anchor="middle" class="boxText">+ candidate profile</text>

  <path d="M1080 692 L1140 692" class="arrow"/>
  <rect x="1140" y="640" width="165" height="105" rx="16" fill="url(#ai)" filter="url(#shadow)"/>
  <text x="1222" y="675" text-anchor="middle" class="boxTitle">Gemini</text>
  <text x="1222" y="698" text-anchor="middle" class="boxText">ChatGoogle</text>
  <text x="1222" y="718" text-anchor="middle" class="boxText">Generative AI</text>

  <path d="M1222 745 L1222 795 L1000 795" class="arrow"/>
  <rect x="820" y="765" width="360" height="45" rx="14" fill="#1e293b" stroke="#64748b"/>
  <text x="1000" y="794" text-anchor="middle" class="boxTitle">Grounded, profile-aware final answer</text>

  <path d="M265 620 C210 620,210 650,175 700" class="dash"/>
  <text x="188" y="612" text-anchor="middle" class="small">strong match</text>

  <path d="M535 527 C590 527,590 620,745 640" class="dash"/>
  <text x="610" y="555" class="small">no strong match</text>

  <text x="85" y="855" class="small">Implemented stack: Python • Streamlit • LangChain • HuggingFace Embeddings • FAISS • Gemini • CSV knowledge base</text>
</svg>